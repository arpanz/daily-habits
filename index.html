<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<title>Daily Habits</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-soft: #1e293b;
    --card: #1e293b;
    --card-2: #243449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --good: #34d399;
    --good-soft: rgba(52, 211, 153, 0.15);
    --warn: #fbbf24;
    --rest: #64748b;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2a4a 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }

  .wrap { max-width: 620px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 18px; }
  header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 0.3px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 0.9rem; }

  /* Date navigator */
  .datebar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin: 18px 0; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px;
    box-shadow: var(--shadow);
  }
  .datebar .navbtn {
    background: var(--card-2); border: 1px solid var(--line); color: var(--text);
    width: 38px; height: 38px; border-radius: 10px; font-size: 1.1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: 0.15s;
  }
  .datebar .navbtn:hover { background: #2c3e57; }
  .datebar .navbtn:disabled { opacity: 0.3; cursor: not-allowed; }
  .datebar .dateinfo { text-align: center; }
  .datebar .dateinfo .d { font-weight: 600; font-size: 1.02rem; }
  .datebar .dateinfo .sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .today-pill {
    font-size: 0.68rem; background: var(--accent); color: #042c3a; padding: 2px 8px;
    border-radius: 999px; font-weight: 700; margin-left: 6px; vertical-align: middle;
  }

  /* Progress ring summary */
  .summary {
    display: flex; align-items: center; gap: 16px; background: var(--card);
    border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px;
    margin-bottom: 18px; box-shadow: var(--shadow);
  }
  .ring { position: relative; width: 72px; height: 72px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.95rem;
  }
  .summary .stext h3 { margin: 0 0 4px; font-size: 1.02rem; }
  .summary .stext p { margin: 0; color: var(--muted); font-size: 0.85rem; }

  /* Habit cards */
  .habit {
    display: flex; align-items: center; gap: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
    margin-bottom: 12px; transition: 0.18s; box-shadow: var(--shadow);
  }
  .habit.done { border-color: var(--good); background: linear-gradient(0deg, var(--good-soft), var(--good-soft)), var(--card); }
  .habit.rest { opacity: 0.6; }

  .icon {
    width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--card-2);
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
  }

  .info { flex: 1; min-width: 0; }
  .info .name { font-weight: 600; font-size: 1rem; }
  .info .meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .streak { color: var(--warn); font-weight: 600; }
  .rest-tag { color: var(--rest); font-weight: 600; }

  /* Check toggle */
  .toggle {
    width: 34px; height: 34px; flex: none; border-radius: 50%; border: 2px solid var(--line);
    background: transparent; cursor: pointer; transition: 0.15s; display: flex;
    align-items: center; justify-content: center; color: transparent; font-size: 1rem; font-weight: 800;
  }
  .toggle.on { background: var(--good); border-color: var(--good); color: #04261a; }

  /* Counter control */
  .counter { display: flex; align-items: center; gap: 8px; flex: none; }
  .counter button {
    width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card-2); color: var(--text); font-size: 1.1rem; cursor: pointer; transition: 0.15s;
  }
  .counter button:hover { background: #2c3e57; }
  .counter .val { min-width: 46px; text-align: center; font-weight: 700; font-size: 0.95rem; }
  .counter .val small { color: var(--muted); font-weight: 500; }

  footer { text-align: center; margin-top: 26px; color: var(--muted); font-size: 0.78rem; line-height: 1.6; }
  footer button {
    background: none; border: 1px solid var(--line); color: var(--muted); padding: 6px 12px;
    border-radius: 8px; cursor: pointer; font-size: 0.76rem; margin-top: 10px;
  }
  footer button:hover { color: var(--text); border-color: var(--muted); }

  @media (max-width: 420px) {
    .info .name { font-size: 0.94rem; }
    .icon { width: 40px; height: 40px; font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Daily Habits</h1>
      <p>What you do daily is your life. Show up today.</p>
    </header>

    <div class="datebar">
      <button class="navbtn" id="prevDay" title="Previous day">&#8249;</button>
      <div class="dateinfo">
        <div class="d" id="dateLabel">—</div>
        <div class="sub" id="dateSub"></div>
      </div>
      <button class="navbtn" id="nextDay" title="Next day">&#8250;</button>
    </div>

    <div class="summary">
      <div class="ring">
        <svg width="72" height="72">
          <circle cx="36" cy="36" r="30" stroke="#334155" stroke-width="8" fill="none" />
          <circle id="ringFill" cx="36" cy="36" r="30" stroke="#34d399" stroke-width="8" fill="none"
                  stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" />
        </svg>
        <div class="pct" id="ringPct">0%</div>
      </div>
      <div class="stext">
        <h3 id="summaryTitle">Let's begin</h3>
        <p id="summarySub">Tap a habit to mark it done.</p>
      </div>
    </div>

    <div id="habitList"></div>

    <footer>
      Saved automatically in this browser. Visit daily to build your streaks.
      <br />
      <button id="resetBtn">Reset all data</button>
    </footer>
  </div>

<script>
(function () {
  "use strict";

  // ---- Habit definitions (all 6, shown from day 1) ----
  // type "check"  -> single done/not-done
  // type "count"  -> increment toward a daily target
  // schedule "everyN" -> only required on scheduled days (anchored to first use)
  var HABITS = [
    { id: "sleep",    name: "Sleep routine",   icon: "\uD83D\uDE34", type: "check",                       hint: "Screens off, wind down, consistent time" },
    { id: "water",    name: "Drink water",     icon: "\uD83D\uDCA7", type: "count", target: 8, unit: "glasses" },
    { id: "meditate", name: "Meditate 15 min", icon: "\uD83E\uDDD8", type: "count", target: 2, unit: "sessions" },
    { id: "exercise", name: "Exercise 30 min", icon: "\uD83D\uDCAA", type: "check",                       hint: "On a bad day, 5 min still counts" },
    { id: "read",     name: "Read a book",     icon: "\uD83D\uDCD6", type: "check",                       hint: "Even 10 pages" },
    { id: "derma",    name: "Derma stamp",     icon: "\u2728", type: "check", scheduleEveryN: 3 }
  ];

  var STORE_KEY = "dailyHabits.v1";
  var ANCHOR_KEY = "dailyHabits.anchor"; // first day used -> derma schedule anchor

  // ---- Date helpers ----
  function ymd(d) {
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }
  function parseYmd(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function daysBetween(a, b) {
    var ms = parseYmd(b).getTime() - parseYmd(a).getTime();
    return Math.round(ms / 86400000);
  }

  // ---- Storage ----
  function loadAll() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveAll(data) { localStorage.setItem(STORE_KEY, JSON.stringify(data)); }

  function getAnchor() {
    var a = localStorage.getItem(ANCHOR_KEY);
    if (!a) { a = ymd(new Date()); localStorage.setItem(ANCHOR_KEY, a); }
    return a;
  }

  // ---- Schedule logic ----
  function isScheduled(habit, dateStr) {
    if (!habit.scheduleEveryN) return true;
    var diff = daysBetween(getAnchor(), dateStr);
    if (diff < 0) return false; // before anchor: not scheduled
    return diff % habit.scheduleEveryN === 0;
  }

  function dayRecord(data, dateStr) {
    if (!data[dateStr]) data[dateStr] = {};
    return data[dateStr];
  }

  function isHabitDone(habit, rec) {
    var v = rec[habit.id];
    if (habit.type === "count") return (v || 0) >= habit.target;
    return !!v;
  }

  // ---- Streak: consecutive scheduled days completed, counting back from given date ----
  function streakFor(habit, data, dateStr) {
    var streak = 0;
    var cur = parseYmd(dateStr);
    var guard = 0;
    while (guard < 3650) {
      guard++;
      var ds = ymd(cur);
      var scheduled = isScheduled(habit, ds);
      if (scheduled) {
        var rec = data[ds] || {};
        if (isHabitDone(habit, rec)) { streak++; }
        else { break; }
      }
      cur = addDays(cur, -1);
      if (daysBetween(getAnchor(), ds) <= 0) break; // don't count before anchor
    }
    return streak;
  }

  // ---- State ----
  var data = loadAll();
  getAnchor();
  var viewDate = new Date(); // currently viewed day

  // ---- Rendering ----
  var TODAY_STR = ymd(new Date());

  function render() {
    var dateStr = ymd(viewDate);
    var rec = dayRecord(data, dateStr);

    // Date bar
    var opts = { weekday: "long", month: "short", day: "numeric" };
    var label = viewDate.toLocaleDateString(undefined, opts);
    document.getElementById("dateLabel").innerHTML =
      label + (dateStr === TODAY_STR ? ' <span class="today-pill">TODAY</span>' : "");
    var diffToday = daysBetween(TODAY_STR, dateStr);
    var sub = "";
    if (diffToday === -1) sub = "Yesterday";
    else if (diffToday < -1) sub = Math.abs(diffToday) + " days ago";
    else if (diffToday === 1) sub = "Tomorrow";
    else if (diffToday > 1) sub = "In " + diffToday + " days";
    document.getElementById("dateSub").textContent = sub;
    // can't go to the future
    document.getElementById("nextDay").disabled = dateStr === TODAY_STR;

    // Build habit cards
    var list = document.getElementById("habitList");
    list.innerHTML = "";

    var requiredCount = 0, doneCount = 0;

    HABITS.forEach(function (h) {
      var scheduled = isScheduled(h, dateStr);
      var done = isHabitDone(h, rec);
      if (scheduled) { requiredCount++; if (done) doneCount++; }

      var card = document.createElement("div");
      card.className = "habit" + (scheduled && done ? " done" : "") + (!scheduled ? " rest" : "");

      // icon
      var icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = h.icon;
      card.appendChild(icon);

      // info
      var info = document.createElement("div");
      info.className = "info";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = h.name;
      info.appendChild(name);

      var meta = document.createElement("div");
      meta.className = "meta";
      var streak = streakFor(h, data, dateStr);
      if (!scheduled) {
        meta.innerHTML = '<span class="rest-tag">Rest day &middot; next in ' +
          daysToNext(h, dateStr) + 'd</span>';
      } else {
        var bits = [];
        if (h.scheduleEveryN) bits.push("every " + h.scheduleEveryN + " days");
        if (h.hint) bits.push(h.hint);
        if (streak > 0) bits.push('<span class="streak">\uD83D\uDD25 ' + streak + ' day' + (streak > 1 ? "s" : "") + '</span>');
        meta.innerHTML = bits.join(" &middot; ");
      }
      info.appendChild(meta);
      card.appendChild(info);

      // control
      if (!scheduled) {
        // no control on rest day
      } else if (h.type === "count") {
        var counter = document.createElement("div");
        counter.className = "counter";
        var minus = document.createElement("button");
        minus.textContent = "\u2212";
        var val = document.createElement("div");
        val.className = "val";
        var cur = rec[h.id] || 0;
        val.innerHTML = cur + " <small>/ " + h.target + "</small>";
        var plus = document.createElement("button");
        plus.textContent = "+";
        minus.onclick = function () { changeCount(h, dateStr, -1); };
        plus.onclick = function () { changeCount(h, dateStr, 1); };
        counter.appendChild(minus);
        counter.appendChild(val);
        counter.appendChild(plus);
        card.appendChild(counter);
      } else {
        var toggle = document.createElement("button");
        toggle.className = "toggle" + (done ? " on" : "");
        toggle.innerHTML = "\u2713";
        toggle.onclick = function () { toggleCheck(h, dateStr); };
        card.appendChild(toggle);
      }

      list.appendChild(card);
    });

    // Summary ring
    var pct = requiredCount === 0 ? 0 : Math.round((doneCount / requiredCount) * 100);
    var circ = 188.5;
    document.getElementById("ringFill").setAttribute("stroke-dashoffset", circ - (circ * pct) / 100);
    document.getElementById("ringPct").textContent = pct + "%";

    var title = document.getElementById("summaryTitle");
    var subEl = document.getElementById("summarySub");
    if (pct === 100) { title.textContent = "All done \uD83C\uDF89"; subEl.textContent = "Great showing up today. This is the life."; }
    else if (pct >= 50) { title.textContent = "Good momentum"; subEl.textContent = doneCount + " of " + requiredCount + " done — keep going."; }
    else if (doneCount > 0) { title.textContent = "Started"; subEl.textContent = doneCount + " of " + requiredCount + " done. Small steps count."; }
    else { title.textContent = "Let's begin"; subEl.textContent = "Tap a habit to mark it done."; }
  }

  function daysToNext(habit, dateStr) {
    for (var i = 1; i <= habit.scheduleEveryN; i++) {
      if (isScheduled(habit, ymd(addDays(parseYmd(dateStr), i)))) return i;
    }
    return habit.scheduleEveryN;
  }

  function toggleCheck(habit, dateStr) {
    var rec = dayRecord(data, dateStr);
    rec[habit.id] = !rec[habit.id];
    saveAll(data);
    render();
  }

  function changeCount(habit, dateStr, delta) {
    var rec = dayRecord(data, dateStr);
    var v = (rec[habit.id] || 0) + delta;
    if (v < 0) v = 0;
    if (v > habit.target + 10) v = habit.target + 10;
    rec[habit.id] = v;
    saveAll(data);
    render();
  }

  // ---- Navigation ----
  document.getElementById("prevDay").onclick = function () {
    viewDate = addDays(viewDate, -1); render();
  };
  document.getElementById("nextDay").onclick = function () {
    if (ymd(viewDate) === TODAY_STR) return;
    viewDate = addDays(viewDate, 1); render();
  };
  document.getElementById("resetBtn").onclick = function () {
    if (confirm("Delete all habit history and streaks? This cannot be undone.")) {
      localStorage.removeItem(STORE_KEY);
      localStorage.removeItem(ANCHOR_KEY);
      data = {};
      getAnchor();
      viewDate = new Date();
      render();
    }
  };

  render();
})();
</script>
</body>
</html>
